name: KRATOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint + Test + Build (Web)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Web
        run: flutter config --enable-web

      - name: Pub get (app)
        working-directory: app
        run: flutter pub get

      - name: Pub get (packages)
        working-directory: packages/kratos_lints
        run: flutter pub get

      - name: Pub get (models)
        working-directory: packages/kratos_models
        run: flutter pub get

      - name: Pub get (uuid_v7)
        working-directory: packages/uuid_v7
        run: flutter pub get

      - name: Format check
        working-directory: app
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-pub

      - name: Test
        working-directory: app
        run: flutter test --no-pub

      - name: Build Web
        working-directory: app
        run: flutter build web --no-pub