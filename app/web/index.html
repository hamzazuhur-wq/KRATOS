<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <script>
    if (window.location.hostname === 'www.kratos-os.online') {
      window.location.replace('https://kratos-os.online' + window.location.pathname + window.location.search + window.location.hash);
    }
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="description" content="KRATOS — offline-first personal operating system. Level up your life with XP, goals, streaks, and deep focus sessions.">

  <!-- iOS PWA meta tags for iPhone home screen install -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KRATOS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Theme color for Android Chrome / Safari URL bar -->
  <meta name="theme-color" content="#C6F135">
  <meta name="msapplication-TileColor" content="#0D0D0D">

  <!-- Open Graph / Twitter card for share previews -->
  <meta property="og:title" content="KRATOS — Level Up Your Life">
  <meta property="og:description" content="Offline-first personal OS. XP, goals, streaks, deep focus.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>KRATOS</title>
  <link rel="manifest" href="manifest.json">

  <!-- Inline splash background to prevent white flash on iOS -->
  <style>
    html, body {
      background-color: #0D0D0D;
      margin: 0;
      padding: 0;
      height: 100%;
    }
  </style>
</head>
<body>
  <script>
    window.kratosNotification = {
      requestPermission: async function() {
        if (!("Notification" in window)) {
          return "unsupported";
        }
        try {
          return await Notification.requestPermission();
        } catch (e) {
          console.error("Failed to request notification permission:", e);
          return "denied";
        }
      },
      getPermission: function() {
        if (!("Notification" in window)) {
          return "unsupported";
        }
        return Notification.permission;
      },
      show: function(title, body) {
        if (!("Notification" in window) || Notification.permission !== "granted") {
          return false;
        }
        try {
          new Notification(title, {
            body: body,
            icon: "icons/Icon-192.png",
            badge: "icons/Icon-192.png"
          });
          return true;
        } catch (e) {
          console.error("Failed to show system notification:", e);
          return false;
        }
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
